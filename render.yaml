services:
  - type: web
    name: gestion-commerce
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 app:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-commerce-db
          property: connectionString

databases:
  - name: gestion-commerce-db
    databaseName: commerce
    user: commerce
    plan: free
